[application]
dark_mode=no

[cc1101]
# spidev node the Cap CC1101 radio is wired to. Leave empty to keep the radio
# disabled. The app sends a reset command to this device on first use.
spi_device=/dev/spidev0.1
spi_speed_hz=500000

[storage]
# The capture library: where captures (.sub files) are saved and what the Saved
# page browses, sub-folders included. Left empty, it is ~/zerosub/sub-ghz of the
# user who started the app, or zerosub/sub-ghz on an external SD card if one is
# mounted under /media, /run/media or /mnt. "zerosub" is the app's data folder;
# each radio module gets its own folder inside it.
# Set a path here to choose the folder yourself, e.g. /home/pi/remotes
directory=

[infrared]
# LIRC devices the Infrared tool receives and sends on, e.g. /dev/lirc0. Left
# empty, the first /dev/lirc* device that can receive, and the first that can
# send, are used.
receive_device=
send_device=
# The remote library: where learned remotes (.ir files) are saved and what
# Saved Remotes browses, sub-folders included. Left empty, it is the
# zerosub/Infrared folder, next to zerosub/sub-ghz (on the SD card if one is
# mounted, otherwise in the home directory).
directory=

[nfc]
# spidev node of the ST25R3916 NFC reader on the Cap CC1101. It is chip select 2
# of SPI0 (GPIO22), which a BSP overlay adds; the app loads that overlay when the
# node is missing. Leave empty to disable the NFC tool.
spi_device=/dev/spidev0.2
spi_speed_hz=5000000
# The tag library: where tags (.nfc files) are saved and what Saved browses,
# sub-folders included. Left empty, it is the zerosub/NFC folder, next to
# zerosub/sub-ghz (on the SD card if one is mounted, otherwise in the home
# directory).
directory=

[rfid]
# The 125 kHz front-end on the EXT header (remove the Cap first: these pins are
# its NFC IRQ and chip select). modulation_gpio loads the coil while high
# (GPIO23, EXT pin 3); field_gpio reads high while a reader's field is present
# (GPIO22, EXT pin 5). Leave modulation_gpio empty to disable the tool, or
# field_gpio empty to send the key all the time.
gpio_chip=/dev/gpiochip0
modulation_gpio=23
field_gpio=22
# Reading: reader_gpio is the comparator output (GPIO15, EXT pin 12) and
# carrier_uart the UART on GPIO14 (EXT pin 14) that drives the coil at 125 kHz.
# The UART needs enable_uart=1 in config.txt and no serial console on it. Leave
# reader_gpio empty to turn reading off. relay_gpio is only for the rev B
# front-end with a mode relay (GPIO9); the rev C front-end has none.
reader_gpio=15
carrier_uart=/dev/serial0
relay_gpio=
# The key library: where keys (.rfid files) are saved and what Saved browses.
# Left empty, it is the zerosub/RFID folder, next to zerosub/NFC.
directory=

[imu]
# The BMI270 accelerometer / gyroscope and the BMM150 magnetometer, shown by
# the IMU tool. i2c_device is the bus the BMI270 is on, e.g. /dev/i2c-1; left
# empty, every /dev/i2c-* bus is searched (0x68 / 0x69). The BMM150 is looked
# for behind the BMI270's auxiliary interface first, then at 0x10-0x13 on the
# same bus. If a kernel driver already owns the chips, their IIO readings are
# used instead. enabled=no keeps the tool off the bus.
enabled=yes
i2c_device=

[web]
# Web Files (main menu) serves the home folder to a browser on the same
# network while the page is open: browse, view, download, upload, rename,
# delete, and install .deb packages (as root, with apt-get). Log in with the
# PIN shown on the device. port is the first TCP port tried; when it is taken
# the next nine are tried, then any free port. The port in use is shown on
# the device.
port=8080
